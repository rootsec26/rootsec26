<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a1a"/>
      <stop offset="50%" style="stop-color:#0d0d2b"/>
      <stop offset="100%" style="stop-color:#1a0a2e"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00f5ff"/>
      <stop offset="50%" style="stop-color:#7b2ff7"/>
      <stop offset="100%" style="stop-color:#ff00e5"/>
    </linearGradient>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00f5ff;stop-opacity:0.15"/>
      <stop offset="50%" style="stop-color:#7b2ff7;stop-opacity:0.1"/>
      <stop offset="100%" style="stop-color:#ff00e5;stop-opacity:0.15"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00f5ff"/>
      <stop offset="100%" style="stop-color:#7b2ff7"/>
    </linearGradient>
    <linearGradient id="caffeineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff00e5"/>
      <stop offset="100%" style="stop-color:#ff6b35"/>
    </linearGradient>
    <linearGradient id="graphGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00f5ff;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#00f5ff;stop-opacity:0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowStrong">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glass">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/>
      <feOffset in="blur" dx="0" dy="2" result="offsetBlur"/>
      <feFlood flood-color="#00f5ff" flood-opacity="0.05" result="color"/>
      <feComposite in="color" in2="offsetBlur" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .cursor-blink { animation: blink 0.8s step-end infinite; }
      @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0; } }
      .pulse { animation: pulse 2s ease-in-out infinite; }
      @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
      .pulse-glow { animation: pulseGlow 2s ease-in-out infinite; }
      @keyframes pulseGlow {
        0%,100% { filter: drop-shadow(0 0 3px #00ff88); }
        50% { filter: drop-shadow(0 0 8px #00ff88); }
      }
      .scanline { animation: scan 4s linear infinite; }
      @keyframes scan {
        0% { transform: translateY(-100%); }
        100% { transform: translateY(600%); }
      }
      .fade-in { animation: fadeIn 0.6s ease-out forwards; opacity: 0; }
      .fade-in-1 { animation-delay: 0.2s; }
      .fade-in-2 { animation-delay: 0.5s; }
      .fade-in-3 { animation-delay: 0.8s; }
      .fade-in-4 { animation-delay: 1.1s; }
      .fade-in-5 { animation-delay: 1.4s; }
      .fade-in-6 { animation-delay: 1.7s; }
      .fade-in-7 { animation-delay: 2.0s; }
      .fade-in-8 { animation-delay: 2.3s; }
      @keyframes fadeIn { 0% { opacity: 0; transform: translateY(5px); } 100% { opacity: 1; transform: translateY(0); } }
      .bar-fill { animation: barGrow 2s ease-out forwards; }
      @keyframes barGrow { 0% { width: 0; } 100% { width: var(--bar-width); } }
      .node-pulse { animation: nodePulse 2s ease-in-out infinite; }
      @keyframes nodePulse {
        0%,100% { r: 4; opacity: 1; }
        50% { r: 6; opacity: 0.6; }
      }
      .dash-anim { animation: dashMove 1.5s linear infinite; }
      @keyframes dashMove { 0% { stroke-dashoffset: 20; } 100% { stroke-dashoffset: 0; } }
      .graph-line { animation: graphDraw 3s ease-out forwards; }
      @keyframes graphDraw {
        0% { stroke-dashoffset: 400; }
        100% { stroke-dashoffset: 0; }
      }
      .float { animation: float 3s ease-in-out infinite; }
      @keyframes float {
        0%,100% { transform: translateY(0); }
        50% { transform: translateY(-3px); }
      }
      .title-glow { animation: titleGlow 3s ease-in-out infinite; }
      @keyframes titleGlow {
        0%,100% { filter: drop-shadow(0 0 4px #00f5ff); }
        50% { filter: drop-shadow(0 0 10px #00f5ff) drop-shadow(0 0 20px #7b2ff7); }
      }
      .metric-highlight { animation: metricPulse 2.5s ease-in-out infinite; }
      @keyframes metricPulse {
        0%,100% { opacity: 1; }
        50% { opacity: 0.7; }
      }
    </style>
  </defs>
